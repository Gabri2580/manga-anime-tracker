<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="vendor/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
<title>Manga & Anime Tracker</title>
<style>
/* Font inclusi nella cartella (SIL OFL): nessuna richiesta esterna, funzionano offline */
@font-face{font-family:"Outfit";src:url(vendor/fonts/outfit.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Work Sans";src:url(vendor/fonts/work-sans.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{
  --bg:#0c0c10;--surface:#15151b;--surface2:#1d1d26;--line:#2a2a35;--line2:#3a3a48;
  --fg:#f4f4f7;--fg2:#cfcfd9;--mut:#9d9daf;--on-acc:#fff;--ring:#fff;--danger:#f87171;--glow:24%;
  --c0:#e11d48;--c0t:#fb7185;   /* primo profilo (ordine alfabetico dei nomi) */
  --c1:#0f766e;--c1t:#2dd4bf;   /* secondo profilo */
  --c2:#b45309;--c2t:#fbbf24;   /* consigli */
  --c3:#2563eb;--c3t:#60a5fa;   /* in comune */
  --s0:#9d9daf;--s1:#60a5fa;--s2:#4ade80;--s3:#f87171;--on-s:#0c0c10;
  --shadow:0 18px 30px -14px #000c;
  --ease:cubic-bezier(.22,1,.36,1);
  --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom);
  color-scheme:dark;
}
@media(prefers-color-scheme:light){:root{
  --bg:#f6f5f1;--surface:#fff;--surface2:#efede8;--line:#dedbd3;--line2:#c8c4ba;
  --fg:#17171c;--fg2:#3a3a45;--mut:#5d5d6a;--ring:#17171c;--danger:#b91c1c;--glow:14%;
  --c0t:#be123c;--c1t:#0f766e;--c2t:#92400e;--c3t:#1d4ed8;
  --s0:#5d5d6a;--s1:#1d4ed8;--s2:#15803d;--s3:#b91c1c;--on-s:#fff;
  --shadow:0 18px 30px -16px #3a2f1f55;
  color-scheme:light;
}}
body[data-a="0"]{--acc:var(--c0);--acc-t:var(--c0t)}
body[data-a="1"]{--acc:var(--c1);--acc-t:var(--c1t)}
body[data-a="2"]{--acc:var(--c2);--acc-t:var(--c2t)}
body[data-a="3"]{--acc:var(--c3);--acc-t:var(--c3t)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font:400 16px/1.5 "Work Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);
  --acc:var(--c0);--acc-t:var(--c0t)}
/* l'accento cambia con il profilo: le dissolvenze stanno sui singoli elementi che lo usano */
.eyebrow,.bh-t i,.cb i,.meter,.meter i,.sw{transition:color .4s var(--ease),background-color .4s var(--ease)}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(1100px 520px at 10% -10%,color-mix(in srgb,var(--acc) var(--glow),transparent),transparent 70%),
             radial-gradient(800px 420px at 100% 0%,color-mix(in srgb,var(--acc) calc(var(--glow)/2),transparent),transparent 70%)}
h1,h2,h3,.fnt{font-family:"Outfit","Work Sans",system-ui,sans-serif}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 48px}

/* ---------- pulsanti e campi ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 16px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;font-weight:500;
  transition:background .2s,border-color .2s,transform .15s var(--ease),filter .2s}
.btn:hover{background:var(--surface2);border-color:var(--line2)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--acc);border-color:transparent;color:var(--on-acc);font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
.btn.ghost{background:none;border-color:transparent;color:var(--mut)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.fl{font-size:13px;font-weight:500;color:var(--mut)}
.field input,.field select,.field textarea,.stepper input{min-height:44px;width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-size:16px;color:var(--fg);transition:border-color .2s,box-shadow .2s}
.field input:focus,.field textarea:focus,.field select:focus,.stepper input:focus{outline:0;border-color:var(--acc-t);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 28%,transparent)}
.field textarea{resize:vertical;min-height:96px}
.fv{min-height:24px;white-space:pre-wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- avatar ---------- */
.u0{--uf:var(--c0);--ut:var(--c0t)}.u1{--uf:var(--c1);--ut:var(--c1t)}
.av{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;background:var(--uf,var(--c0));color:#fff;font:700 13px "Outfit",sans-serif}
.av.lg{width:60px;height:60px;font-size:26px}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid transparent;transition:border-color .25s}
.top.scrolled{border-color:var(--line)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px;padding-top:calc(10px + var(--safe-t))}
.brand{display:flex;align-items:center;gap:10px;font:700 19px "Outfit",sans-serif;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.seg{--pad:4px;position:relative;display:inline-flex;gap:2px;padding:var(--pad);background:var(--surface);border:1px solid var(--line);border-radius:16px}
.seg button{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:12px;background:none;color:var(--mut);font:600 14.5px "Outfit",sans-serif;white-space:nowrap;transition:color .25s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed=true]{color:var(--on-acc)}
.seg button[aria-pressed=true] .av{box-shadow:0 0 0 2px #fffa}
.ind{position:absolute;z-index:0;left:0;width:var(--w,0);transform:translateX(var(--x,0));pointer-events:none}
.ind.ready{transition:transform .4s var(--ease),width .4s var(--ease)}
.seg .ind{top:var(--pad);bottom:var(--pad);border-radius:12px;background:var(--acc);box-shadow:0 6px 16px -6px var(--acc)}
.views{position:fixed;top:calc(9px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:30}
.avbtn{margin-left:auto;display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--surface);transition:border-color .2s,transform .15s var(--ease)}
.avbtn:hover{border-color:var(--line2)}.avbtn:active{transform:scale(.94)}

/* ---------- hero ---------- */
.hero{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px 32px;padding:30px 0 6px}
.who{display:flex;align-items:center;gap:16px;min-width:0}
.eyebrow{margin:0 0 2px;font:600 12px "Outfit",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--acc-t)}
.hero h1{margin:0;font-weight:700;font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.025em}
.hero .sub{margin:6px 0 0;color:var(--mut);max-width:48ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(80px,1fr));gap:10px;margin:0;flex:1 1 380px;max-width:580px}
.stat{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.stat dt{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat dd{margin:2px 0 0;font:700 28px/1.1 "Outfit",sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ---------- barra strumenti ---------- */
.ctrl{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;margin-top:20px;border-bottom:1px solid var(--line)}
.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{min-height:46px;padding:0 16px;border:0;background:none;color:var(--mut);font:600 15.5px "Outfit",sans-serif;transition:color .2s}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-pressed=true]{color:var(--fg)}
.tabs .ind{bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--acc)}
.actions{display:flex;gap:8px;padding-bottom:8px}
.find{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--mut);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--acc-t);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 26%,transparent)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:16px;color:var(--fg)}
.sort{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 6px 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--mut)}
.sort select{min-height:44px;border:0;background:none;color:var(--fg);font-weight:500;outline:0;padding-right:6px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg2);font-size:14px;font-weight:500;transition:background .2s,border-color .2s,transform .15s var(--ease)}
.chip:hover{border-color:var(--line2)}.chip:active{transform:scale(.96)}
.chip em{font-style:normal;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{border-color:var(--acc-t);background:color-mix(in srgb,var(--acc) 20%,var(--surface))}
.note-bar{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg2);font-size:14px;animation:drop .35s var(--ease)}
.note-bar svg{color:var(--acc-t)}

/* ---------- griglia e schede ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:26px 18px;padding:22px 0}
.card{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer;border-radius:16px;-webkit-tap-highlight-color:transparent;transition:transform .3s var(--ease)}
.card:focus-visible{outline:2px solid var(--ring);outline-offset:5px}
.card:active{transform:scale(.97)}
.cover{position:relative;display:block;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);box-shadow:0 8px 20px -12px #000a;transition:box-shadow .35s var(--ease),border-color .3s}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;padding:14px;text-align:center;color:var(--mut);font:600 15px/1.3 "Outfit",sans-serif}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s,transform .6s var(--ease)}
.cover img.l{opacity:1}
@media(hover:hover){
  .card:hover{transform:translateY(-5px)}
  .card:hover .cover{box-shadow:var(--shadow);border-color:var(--line2)}
  .card:hover .cover img{transform:scale(1.06)}
}
.pill{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;background:color-mix(in srgb,#000 64%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:11.5px;font-weight:600}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--s0))}
.st0{--c:var(--s0)}.st1{--c:var(--s1)}.st2{--c:var(--s2)}.st3{--c:var(--s3)}
.score{position:absolute;top:8px;right:8px;display:inline-flex;align-items:center;gap:4px;padding:3px 9px 3px 7px;border-radius:999px;background:color-mix(in srgb,#000 64%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font:700 12px "Outfit",sans-serif}
.score svg{width:13px;height:13px;color:#fbbf24;fill:#fbbf24;stroke:#fbbf24}
.badge-i{position:absolute;bottom:8px;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,#000 64%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff}
.badge-i svg{width:16px;height:16px}
.badge-i.own{left:8px}.badge-i.warn{right:8px;background:#f59e0b;color:#000}
.meta{display:flex;flex-direction:column;gap:3px;padding:0 2px;min-width:0}
.meta b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:600 15px/1.25 "Outfit",sans-serif;letter-spacing:-.005em}
.meta small{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;margin-top:5px;border-radius:2px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;width:var(--p);border-radius:2px;background:var(--c,var(--acc));transform-origin:left}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
@keyframes shine{to{background-position:-200% 0}}
.anim .card,.anim .rec{animation:rise .55s var(--ease) backwards;animation-delay:calc(var(--i,0) * 32ms)}
.anim .bar i{animation:grow .9s var(--ease) backwards;animation-delay:calc(var(--i,0) * 32ms + 220ms)}

.sk .cover,.sk .meta i{background:linear-gradient(100deg,var(--surface2) 30%,color-mix(in srgb,var(--surface2) 78%,var(--fg)) 50%,var(--surface2) 70%);background-size:200% 100%;animation:shine 1.4s linear infinite}
.sk .meta i{display:block;height:12px;border-radius:6px}

.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:56px 16px;text-align:center}
.empty .eico{display:grid;place-items:center;width:72px;height:72px;margin-bottom:10px;border-radius:50%;background:color-mix(in srgb,var(--acc) 16%,var(--surface));color:var(--acc-t)}
.empty .eico svg{width:32px;height:32px}
.empty h3{margin:0;font-size:22px;letter-spacing:-.01em}
.empty p{margin:0;max-width:42ch;color:var(--mut)}
.empty .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}

/* ---------- risultati ricerca ---------- */
#res{display:none;margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
#res.show{display:block;animation:drop .4s var(--ease)}
#res .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#res .head small{display:block;color:var(--mut)}
#res .grid{padding:18px 0 4px}

/* ---------- consigli ---------- */
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:22px 0}
.rec{position:relative;display:flex;gap:16px;padding:16px 16px 16px 20px;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:border-color .25s,transform .3s var(--ease)}
.rec::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--uf)}
@media(hover:hover){.rec:hover{border-color:var(--line2);transform:translateY(-3px)}}
.rec .cv{width:96px;flex:none}
.rec .body{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.rec .line{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mut)}
.kind{padding:2px 10px;border-radius:999px;background:var(--surface2);color:var(--fg2);font-weight:600;font-size:12px}
.rec h3{margin:0;font-size:19px;line-height:1.2;letter-spacing:-.01em}
.rec .qt{margin:0;padding-left:12px;border-left:2px solid var(--line2);color:var(--fg2);white-space:pre-wrap;overflow-wrap:anywhere}
.rec .foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.by{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--fg2)}
.by b{color:var(--ut);font-weight:600}
.rec .btn{min-height:40px;padding:0 12px;font-size:14px}
.added{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--s2)}

/* ---------- finestre ---------- */
dialog{width:min(480px,94vw);max-height:92vh;padding:0;border:1px solid var(--line);border-radius:24px;background:var(--surface);color:var(--fg);box-shadow:0 30px 80px -20px #000d;overflow:auto;
  opacity:0;transform:translateY(24px) scale(.97);
  transition:opacity .22s ease,transform .32s var(--ease),overlay .22s allow-discrete,display .22s allow-discrete}
dialog[open]{opacity:1;transform:none}
@starting-style{dialog[open]{opacity:0;transform:translateY(24px) scale(.97)}}
dialog::backdrop{background:#0000;backdrop-filter:blur(0);transition:background .25s,backdrop-filter .25s,overlay .25s allow-discrete,display .25s allow-discrete}
dialog[open]::backdrop{background:#000b;backdrop-filter:blur(4px)}
@starting-style{dialog[open]::backdrop{background:#0000;backdrop-filter:blur(0)}}
.dlg{position:relative;display:flex;flex-direction:column;gap:18px;padding:24px}
.dlg:focus{outline:0}
.dlg h2{margin:0;font-size:24px;line-height:1.15;letter-spacing:-.015em}
.dlg p{margin:0;color:var(--mut);font-size:14.5px}
.dlg .x{position:absolute;top:14px;right:14px;width:40px;height:40px;min-height:0;min-width:0;padding:0;border-radius:50%}
.dh{display:flex;gap:16px;padding-right:36px}
.dh .cover{width:104px;flex:none}
.dh .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;justify-content:center}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:42px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg2);font-weight:500;transition:background .2s,border-color .2s,transform .15s var(--ease)}
.opt:hover{border-color:var(--line2)}.opt:active{transform:scale(.96)}
.opt[aria-pressed=true]{border-color:var(--acc-t);background:color-mix(in srgb,var(--acc) 22%,var(--bg));color:var(--fg)}
.stepper{display:flex;align-items:stretch;gap:8px}
.stepper .btn{padding:0;flex:none;width:46px}
.stepper input{text-align:center;font-variant-numeric:tabular-nums}
.foot-acts{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prof{display:flex;align-items:center;gap:16px;padding-right:36px}
.prof>div{min-width:0}.prof p{overflow:hidden;text-overflow:ellipsis}
.list{display:flex;flex-direction:column;gap:6px}
.row-btn{display:flex;align-items:center;gap:14px;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);text-align:left;font-weight:500;transition:background .2s,border-color .2s,transform .15s var(--ease)}
.row-btn:hover{background:var(--surface2);border-color:var(--line2)}.row-btn:active{transform:scale(.98)}
.row-btn.danger{color:var(--danger)}
.login{text-align:center;align-items:stretch}
.login .brand{justify-content:center;font-size:26px}.login .brand svg{width:44px;height:44px}
.login .field{text-align:left}
.err{color:var(--danger);min-height:1.4em;font-size:14px}
pre#log{margin:0;max-height:220px;overflow:auto;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font:12.5px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap}

/* ---------- avvisi ---------- */
#toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));z-index:60;max-width:min(92vw,520px);padding:12px 18px;border-radius:14px;background:var(--fg);color:var(--bg);font-size:14.5px;font-weight:500;box-shadow:0 14px 40px -10px #000c;
  opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity .25s,transform .4s var(--ease)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#b91c1c;color:#fff}

/* ---------- preferiti, in comune, promemoria ---------- */
.tabs em{margin-left:6px;font-style:normal;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.tabs button[data-k=stats]{position:relative;margin-left:14px}
.tabs button[data-k=stats]::before{content:"";position:absolute;left:-8px;top:13px;bottom:13px;width:1px;background:var(--line2)}
.fav{position:absolute;right:8px;bottom:8px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,#000 64%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;transition:transform .2s var(--ease)}
.fav::after{content:"";position:absolute;inset:-8px}
.fav svg{width:16px;height:16px}
.fav.on{color:#fb7185}.fav.on svg{fill:currentColor}
.fav[data-fav]:hover{transform:scale(1.12)}.fav[data-fav]:active{transform:scale(.9)}
.badge-i.warn{right:46px}
.opt{display:inline-flex;align-items:center;gap:8px}
.opt.fav-toggle[aria-pressed=true] svg{color:#fb7185;fill:#fb7185}
.miss{margin:0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--c2) 14%,var(--bg));border:1px solid color-mix(in srgb,var(--c2t) 40%,var(--line));color:var(--fg2);font-size:14px}
.miss b{color:var(--c2t);font-weight:600}
.cmn{display:flex;gap:16px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;transition:border-color .25s,transform .3s var(--ease)}
@media(hover:hover){.cmn:hover{border-color:var(--line2);transform:translateY(-3px)}}
.cmn .cv{all:unset;box-sizing:border-box;width:92px;flex:none;cursor:pointer;border-radius:14px}
.cmn .cv:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
.cmn .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.cmn h3{margin:0;font-size:19px;line-height:1.2;letter-spacing:-.01em}
.cmn .line{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mut)}
#commonbody{grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr))}
.prow{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;white-space:nowrap;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;font-size:14px;transition:border-color .2s,background .2s}
.prow:hover{border-color:var(--line2);background:var(--surface2)}
.prow:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.prow b{color:var(--ut);font-weight:600}
.prow .sp{flex:1}
.prow .sc{display:inline-flex;align-items:center;gap:4px;font:700 13px "Outfit",sans-serif}
.prow .sc svg{width:13px;height:13px;color:#fbbf24;fill:#fbbf24;stroke:#fbbf24}
.prow .pg{color:var(--mut);font-size:13px}
.dot{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:var(--c,var(--s0))}

/* ---------- statistiche (grafici in HTML/CSS) ---------- */
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;padding:22px 0}
.pan{display:flex;flex-direction:column;gap:14px;min-width:0;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.pan.wide{grid-column:1/-1}
.pan h3{margin:0;font-size:18px;letter-spacing:-.01em}
.psub{margin:-8px 0 0;color:var(--mut);font-size:13.5px}
.pempty{margin:0;color:var(--mut)}
.bh{display:flex;flex-direction:column;gap:12px}
.bh-row{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:12px}
.bh-l{font-size:13.5px;color:var(--fg2)}
.bh-t{display:flex;align-items:center;gap:8px;min-width:0;height:26px;border-left:1px solid var(--line)}
.bh-t i{position:relative;display:block;flex:none;height:16px;width:calc((100% - 34px) * var(--k));border-radius:0 4px 4px 0;background:var(--acc);transform-origin:left}
.bh-t i::after{content:"";position:absolute;inset:-6px 0}
.bh-t b{font:600 13px "Outfit",sans-serif;font-variant-numeric:tabular-nums}
.sgb{display:flex;gap:2px;height:28px}
.sgp{display:grid;place-items:center;min-width:6px;border-radius:4px;background:var(--c,var(--s0));color:var(--on-s);font:700 12px "Outfit",sans-serif;transform-origin:left}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;padding:0;list-style:none;font-size:13px;color:var(--fg2)}
.leg li{display:flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c,var(--s0))}
.cols{display:flex;gap:6px;padding-top:22px}
.colm{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.cb{position:relative;display:flex;align-items:flex-end;justify-content:center;width:100%;height:130px;border-bottom:1px solid var(--line)}
.cb i{position:relative;display:block;width:min(24px,72%);height:calc(100% * var(--h));border-radius:4px 4px 0 0;background:var(--acc);transform-origin:bottom}
.cb i::after{content:"";position:absolute;inset:-8px -4px 0}
.cb i b{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);font:700 12px "Outfit",sans-serif;color:var(--fg)}
.cl{font-size:11.5px;color:var(--mut);white-space:nowrap}
.bh-t i:hover,.cb i:hover,.sgp:hover{filter:brightness(1.15)}
.bh-t i:focus-visible,.cb i:focus-visible,.sgp:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.meter{height:10px;border-radius:999px;background:color-mix(in srgb,var(--acc) 20%,var(--surface2));overflow:hidden}
.meter i{display:block;height:100%;width:calc(100% * var(--k));border-radius:999px;background:var(--acc);transform-origin:left}
.mline{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--fg2)}
.mline b{font:700 16px "Outfit",sans-serif;color:var(--fg)}
.rows{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rowb{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 10px;border:1px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer;transition:border-color .2s,background .2s}
.rowb:hover{border-color:var(--line2);background:var(--surface2)}
.rowb:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.rowb .t{flex:1;min-width:0;display:flex;flex-direction:column}
.rowb .t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 14.5px/1.25 "Outfit",sans-serif}
.rowb .t small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);font-size:12.5px}
.rowb .rt{display:inline-flex;align-items:center;gap:4px;font:700 14px "Outfit",sans-serif;white-space:nowrap}
.rowb .rt svg{width:14px;height:14px;color:#fbbf24;fill:#fbbf24;stroke:#fbbf24}
.thumb{width:34px;flex:none}.thumb .cover{border-radius:6px;box-shadow:none}.thumb .cover .ph{font-size:0}
details.tbl{font-size:13px;color:var(--mut)}
details.tbl summary{display:flex;align-items:center;min-height:32px;cursor:pointer}
details.tbl table{width:100%;margin-top:6px;border-collapse:collapse}
details.tbl th,details.tbl td{padding:6px 4px;border-top:1px solid var(--line);font-weight:400;text-align:left}
details.tbl td{text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
.anim .cb i{animation:growY .8s var(--ease) backwards;animation-delay:calc(var(--i,0) * 45ms)}
.anim .bh-t i{animation:growX .8s var(--ease) backwards;animation-delay:calc(var(--i,0) * 70ms)}
.anim .sgp,.anim .meter i{animation:growX .9s var(--ease) backwards}
#tip{position:fixed;z-index:70;max-width:240px;padding:6px 10px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:500;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
#tip.on{opacity:1;transform:none}

/* ---------- importazione guidata e consigli automatici ---------- */
#impd{width:min(560px,96vw)}
.impd .miss{margin:0}
.impd .pbar{margin-right:48px}
.pbar{height:6px;border-radius:999px;background:color-mix(in srgb,var(--acc) 18%,var(--surface2));overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:999px;background:var(--acc);transition:width .35s var(--ease)}
.psub{margin:0;color:var(--mut);font-size:13.5px}
.imgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0}
.imgrid .stat{padding:10px 12px}.imgrid .stat dd{font-size:24px}.imgrid .stat dt{white-space:normal;font-size:12px}
.from{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.from small{color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}.from b{font:600 17px/1.3 "Outfit",sans-serif;overflow-wrap:anywhere}
.chipsrow{display:flex;flex-wrap:wrap;gap:6px}
.cands{display:flex;flex-direction:column;gap:8px}
.cand{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer;transition:border-color .2s,background .2s,transform .15s var(--ease)}
.cand:hover{border-color:var(--acc-t);background:var(--surface2)}.cand:active{transform:scale(.985)}
.cand:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.cand[disabled]{opacity:.5;cursor:not-allowed}
.thumb2{width:46px;flex:none}.thumb2 .cover{border-radius:8px;box-shadow:none}.thumb2 .cover .ph{font-size:0}
.ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ct b{font:600 15px/1.25 "Outfit",sans-serif;overflow-wrap:anywhere}.ct small{color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
.cm{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;color:var(--mut);font-size:12.5px}
.inlib{font-size:12px;color:var(--s2);white-space:nowrap}
.nfbox{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.nfbox h3{margin:0;font-size:16px}.nfbox p{margin:0}
pre.nflist{margin:0;max-height:200px;overflow:auto;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.sg-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.sg-head small{display:block;color:var(--mut);margin-top:2px}
.sg-h{grid-column:1/-1;margin:10px 0 -4px;font-size:18px;letter-spacing:-.01em}
.rec.sg::before{background:var(--acc)}
.rec .why{margin:0;color:var(--fg2);font-size:14px}
.sgact{gap:8px}.sgact .btn{min-height:40px;padding:0 12px;font-size:14px}
.tier{margin-left:auto;padding:2px 10px;border-radius:999px;font-weight:700;font-size:12px;background:var(--surface2);color:var(--fg2)}
.tier.t-Ottima{background:color-mix(in srgb,var(--s2) 22%,var(--surface2));color:var(--fg)}
.tier.t-Buona{background:color-mix(in srgb,var(--acc) 22%,var(--surface2));color:var(--fg)}
.rec.sk .body i{display:block;height:14px;margin:6px 0;border-radius:7px;background:linear-gradient(100deg,var(--surface2) 30%,color-mix(in srgb,var(--surface2) 78%,var(--fg)) 50%,var(--surface2) 70%);background-size:200% 100%;animation:shine 1.4s linear infinite}
.rec.sk .cover{background:linear-gradient(100deg,var(--surface2) 30%,color-mix(in srgb,var(--surface2) 78%,var(--fg)) 50%,var(--surface2) 70%);background-size:200% 100%;animation:shine 1.4s linear infinite}

/* ---------- telefono: navigazione in basso ---------- */
@media(max-width:719px){
  .views{--pad:6px;top:auto;left:12px;right:12px;transform:none;bottom:calc(10px + var(--safe-b));display:flex;gap:0;border-radius:24px;
    background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 16px 40px -12px #000c}
  .views button{flex:1;flex-direction:column;justify-content:center;gap:3px;min-height:58px;padding:0 4px;font-size:12.5px}
  .views .av{width:28px;height:28px}
  .views .ind{border-radius:18px}
  .wrap{padding-bottom:120px}
  #toast{bottom:calc(98px + var(--safe-b))}
  .brand span{font-size:18px}
  .stats{grid-template-columns:repeat(2,1fr);flex-basis:100%;max-width:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:22px 14px}
  .recs,#commonbody{grid-template-columns:1fr}
  /* "in comune": copertina piccola accanto al titolo, le due righe a tutta larghezza sotto */
  .cmn{display:grid;grid-template-columns:72px 1fr;gap:10px 14px}
  .cmn .body{display:contents}
  .cmn .cv{width:72px;grid-row:1/3}
  .cmn .line,.cmn h3{grid-column:2}
  .cmn .prow{grid-column:1/-1}
  .actions .lbl{display:none}.actions .btn{padding:0}
  .imgrid{grid-template-columns:repeat(2,1fr)}
  #impd{width:100%}
  /* finestre come "sheet" dal basso */
  dialog{width:100%;max-width:none;max-height:94vh;margin:auto 0 0;border-radius:26px 26px 0 0;border-bottom:0;transform:translateY(100%)}
  dialog[open]{transform:none}
  @starting-style{dialog[open]{transform:translateY(100%);opacity:1}}
  .dlg{padding:22px 20px calc(22px + var(--safe-b))}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}
</style>
